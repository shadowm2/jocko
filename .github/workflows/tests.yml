name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        timeout-minutes: 5
        # Playwright's server outlives the tests; keeping the output in a file stops it holding this step open.
        run: |
          timeout -s KILL 150 composer test:browser > browser.log 2>&1 < /dev/null || status=$?
          cat browser.log
          ps -eo pid,etime,args | grep -E 'playwright|chrom|pest' | grep -v grep | cut -c1-200 || true
          ls ~/.cache/ms-playwright
          exit "${status:-0}"
